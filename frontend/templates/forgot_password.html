<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password - ChronoGen</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; font-family: 'Inter', sans-serif; height: 100vh; display: flex; justify-content: center; align-items: center; background: #0f172a; color: #f8fafc; }
        .bg-animation { position: fixed; width: 100%; height: 100%; overflow: hidden; top: 0; left: 0; z-index: -1; background: linear-gradient(135deg, #1e293b, #0f172a); }
        .bg-animation span { position: absolute; display: block; width: 20px; height: 20px; background: rgba(245, 158, 11, 0.1); animation: move 20s linear infinite; bottom: -150px; border-radius: 50%; box-shadow: 0 0 20px rgba(245, 158, 11, 0.4); }
        .bg-animation span:nth-child(1) { left: 10%; animation-delay: 0s; width: 80px; height: 80px; }
        .bg-animation span:nth-child(2) { left: 30%; animation-delay: 5s; width: 50px; height: 50px; }
        .bg-animation span:nth-child(3) { left: 50%; animation-delay: 10s; width: 100px; height: 100px; }
        .bg-animation span:nth-child(4) { left: 70%; animation-delay: 15s; width: 60px; height: 60px;}
        .bg-animation span:nth-child(5) { left: 90%; animation-delay: 20s; width: 90px; height: 90px;}
        @keyframes move { 0% { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; } 100% { transform: translateY(-1000px) scale(0.5) rotate(360deg); opacity: 0; } }
        
        .card { position: relative; z-index: 1; background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); padding: 50px 40px; border-radius: 20px; width: 420px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); border: 1px solid rgba(255, 255, 255, 0.1); text-align: center; }
        h2 { margin-bottom: 20px; font-size: 34px; font-weight: 800; background: linear-gradient(to right, #f59e0b, #d97706); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; }
        p { color: #94a3b8; font-size: 15px; margin-bottom: 25px; line-height: 1.5; }
        input { width: 100%; padding: 14px 16px; margin: 12px 0; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; outline: none; background: rgba(15, 23, 42, 0.6); color: #fff; font-size: 18px; box-sizing: border-box; transition: all 0.3s ease; }
        input:focus { border-color: #f59e0b; box-shadow: 0 0 10px rgba(245, 158, 11, 0.2); }
        button { width: 100%; padding: 14px; margin-top: 10px; border: none; border-radius: 12px; background: linear-gradient(135deg, #f59e0b, #d97706); color: white; font-size: 18px; font-weight: 600; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3); }
        button:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(245, 158, 11, 0.5); }
        a { display: inline-block; margin-top: 25px; color: #94a3b8; text-decoration: none; font-size: 16px; transition: color 0.3s; }
        a:hover { color: #f59e0b; }
    </style>
</head>
<body>
<div class="bg-animation"><span></span><span></span><span></span><span></span><span></span></div>
<div class="card">
    <h2>Reset Password</h2>
    <p>Enter your email address and we'll send you a verification code.</p>
    <form method="post">
        <input type="email" name="email" placeholder="Email address" required>
        <button type="submit">Send Verification Code</button>
    </form>
    <a href="/login">Back to Login</a>
</div>
</body>
</html>
